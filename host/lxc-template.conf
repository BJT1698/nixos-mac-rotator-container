# ==============================================================================
# LXC container configuration for NixOS MAC Rotator Node
# Placed under /var/lib/lxc/<container-id>/config
# ==============================================================================

# Architecture & Identity
lxc.arch = x86_64
lxc.uts.name = @CONTAINER_ID@

# Root filesystem path
lxc.rootfs.path = dir:/var/lib/lxc/@CONTAINER_ID@/rootfs

# Entrypoint to NixOS init system
lxc.init.cmd = /init

# Network Configuration (veth pair attached to host bridge br0)
lxc.net.0.type = veth
lxc.net.0.flags = up
lxc.net.0.link = br0
lxc.net.0.name = eth0
lxc.net.0.hwaddr = 02:00:00:10:00:01

# Capabilities Management
# Retain CAP_NET_ADMIN to enable runtime MAC address spoofing and interface toggling
lxc.cap.keep = net_admin net_raw sys_admin chown dac_override fowner fsetid kill setgid setuid setpcap sys_chroot sys_ptrace

# Virtual Filesystems & Pseudo Devices
lxc.mount.auto = proc:mixed sys:mixed cgroup:mixed
lxc.autodev = 1
lxc.pty.max = 1024
lxc.tty.max = 4

# Console & Logging
lxc.log.level = 1
lxc.log.file = /var/log/lxc/@CONTAINER_ID@.log
